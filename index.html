* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: radial-gradient(ellipse at top, #18234a 0%, var(--bg) 60%) fixed, var(--bg);
  color: var(--text);
  min-height: 100vh;
  font-size: 15px;
}
button {
  font: inherit; cursor: pointer; border-radius: 8px; border: 1px solid var(--line);
  background: var(--panel2); color: var(--text); padding: 8px 14px;
}
button:hover:not(:disabled) { border-color: var(--accent); }
button:disabled { opacity: 0.4; cursor: not-allowed; }
button.primary { background: var(--accent); color: #241400; border-color: var(--accent); font-weight: 700; }
button.danger { background: var(--accent2); color: #fff; border-color: var(--accent2); font-weight: 700; }
button.ghost { background: transparent; }
button.link { background: none; border: none; color: var(--accent); text-decoration: underline; padding: 0 4px; font-weight: 700; }
kbd {
  font-size: 11px; border: 1px solid currentColor; border-bottom-width: 2px; border-radius: 4px;
  padding: 0 4px; opacity: 0.6; margin-left: 8px; font-weight: 400;
}
.muted { color: var(--muted); }
.accent { color: var(--accent); }
.bad { color: var(--bad); }

/* Header */
header {
  display: flex; align-items: center; gap: 18px; flex-wrap: wrap;
  padding: 10px 20px; background: #16244f; border-bottom: 1px solid var(--line);
}
header h1 { font-size: 20px; margin: 0; }
header .meta { display: flex; gap: 18px; color: var(--muted); font-size: 18px; }
header .meta b { color: var(--text); }
header .spacer { flex: 1; }
header .tools { display: flex; gap: 8px; flex-wrap: wrap; }
.hbtn { font-weight: 600; font-size: 16px; padding: 7px 12px; background: transparent; border-color: #4a5c99; }
.hbtn.strong { background: var(--bg); border-color: var(--text); }
.hbtn.ghost { color: var(--muted); }

/* Board layout: hands | boards | track */
.board {
  display: grid;
  grid-template-columns: 300px minmax(0, 720px) 230px;
  grid-template-rows: auto 1fr auto;
  grid-template-areas:
    "oh ob tr"
    ".  mid tr"
    "mh mb tr";
  gap: 16px 22px;
  justify-content: center;
  padding: 18px 20px 24px;
  min-height: calc(100vh - 62px);
}
#opp-hands { grid-area: oh; }
#opp-board { grid-area: ob; }
#middle { grid-area: mid; }
#my-hands { grid-area: mh; }
#my-board { grid-area: mb; }
#track { grid-area: tr; }

@media (max-width: 1180px) {
  .board {
    grid-template-columns: minmax(0, 1fr) 150px;
    grid-template-areas: "ob tr" "oh tr" "mid tr" "mb tr" "mh tr";
    grid-template-rows: auto;
  }
  .handsbox { min-height: 0; }
  .hlist { min-height: 40px; }
  #track { position: sticky; top: 12px; height: calc(100vh - 100px); min-height: 360px; align-self: start; }
}
@media (max-width: 640px) {
  .board {
    grid-template-columns: minmax(0, 1fr);
    grid-template-areas: "ob" "oh" "mid" "mb" "mh" "tr";
    padding: 12px 16px;
  }
  #track { position: static; height: 320px; min-height: 0; }
  header .meta { font-size: 15px; }
  .hbtn { font-size: 14px; padding: 5px 9px; }
}

/* Hands boxes (left column) */
.handsbox {
  background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 8px;
  display: flex; flex-direction: column; min-height: 250px; align-self: stretch;
}
.handsbox .hhead { background: var(--panel2); border-radius: 8px; text-align: center; font-weight: 700; padding: 12px 8px; margin-bottom: 8px; }
.hlist { list-style: none; margin: 0; padding: 0 4px; flex: 1; display: flex; flex-direction: column; gap: 4px; font-size: 14px; overflow: auto; max-height: 260px; }
.hlist li { display: flex; justify-content: space-between; gap: 8px; padding: 3px 4px; border-radius: 6px; font-weight: 600; }
.hlist li.empty { color: var(--muted); font-weight: 400; }
.hlist li.pick { cursor: pointer; outline: 1px dashed var(--chips); }
.hlist li.pick:hover { background: #24407a; }
.hfoot { padding: 8px 4px 2px; }
.copied { font-size: 10px; color: var(--chips); border: 1px solid var(--chips); border-radius: 8px; padding: 0 4px; margin-left: 4px; font-weight: 400; }

.gauge { display: flex; align-items: center; gap: 10px; }
.gauge .glabel { font-size: 13px; font-weight: 600; color: var(--muted); white-space: nowrap; }
.gauge .segs { display: flex; gap: 5px; flex: 1; }
.gauge .seg { flex: 1; height: 13px; border-radius: 7px; background: #2a3566; transition: background 0.3s; }
.gauge .seg.on { background: linear-gradient(to right, var(--accent2), var(--accent)); box-shadow: 0 0 8px rgba(255, 140, 60, 0.45); }

/* Ship boards (center column) */
.ship-board {
  background: var(--bg2); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px;
  display: flex; flex-direction: column; gap: 12px;
}
.ship-board.opp { border-top: 3px solid var(--opp); }
.ship-board.me { border-bottom: 3px solid var(--me); }
.board-title { text-align: center; font-size: 22px; font-weight: 700; color: var(--muted); }
.oppnote { font-size: 13px; color: var(--muted); text-align: center; min-height: 18px; }
.oppnote b { color: var(--text); }

.toolbar { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.pu-row, .it-row { display: flex; gap: 8px; flex-wrap: wrap; }
.pu-tile {
  width: 46px; height: 46px; border-radius: 9px; display: flex; align-items: center; justify-content: center; font-size: 22px;
  background: var(--panel2); border: 2px solid var(--chips);
}
.pu-tile.off { opacity: 0.3; filter: grayscale(1); }
.it-tile {
  min-width: 46px; height: 46px; border-radius: 9px; display: inline-flex; align-items: center; justify-content: center;
  padding: 0 8px; font-weight: 800; font-size: 15px; background: var(--panel2); color: var(--text); border: 2px solid var(--accent);
}
button.it-tile:disabled { opacity: 0.45; }
button.it-tile.active { background: var(--accent); color: #241400; }
.it-tile.slot { border: 2px dashed var(--line); background: transparent; }

.velocity { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 15px; }
.velocity .vlabel { white-space: nowrap; font-variant-numeric: tabular-nums; }
.velocity .vsegs { display: flex; gap: 5px; flex: 1; }
.velocity .seg { flex: 1; height: 15px; border-radius: 8px; background: #2a3566; transition: background 0.5s; }
.velocity.me .seg.on { background: var(--me); }
.velocity.opp .seg.on { background: var(--opp); }
.rocket-ico { width: 18px; height: 30px; background: center / contain no-repeat; transform: rotate(45deg); flex: none; }
.rocket-ico.me { background-image: var(--rocket-blue); }
.rocket-ico.opp { background-image: var(--rocket-red); }

.action-row { display: flex; gap: 12px; }
.big-btn { flex: 1; font-size: 22px; font-weight: 800; padding: 18px 10px; border-radius: 8px; border: none; }
.big-btn.roll { background: var(--good); color: #062614; }
.big-btn.launch { background: var(--accent2); color: #2a0b00; }
.big-btn:disabled { opacity: 0.3; }

.dice-row { display: flex; gap: 12px; justify-content: center; }
.die {
  flex: 1 1 0; max-width: 104px; aspect-ratio: 1; border-radius: 10px; background: var(--die); color: var(--die-text);
  display: flex; align-items: center; justify-content: center; font-size: clamp(22px, 4vw, 38px); font-weight: 800;
  box-shadow: 0 4px 0 #b8b2a2, 0 6px 14px rgba(0, 0, 0, 0.4); user-select: none; border: 3px solid transparent;
  transition: transform 0.12s, border-color 0.12s; padding: 0; min-width: 0;
}
.die.static { cursor: default; }
.die.clickable:hover { transform: translateY(-3px); }
.die.sel { border-color: var(--sel); transform: translateY(-6px); box-shadow: 0 4px 0 #b8b2a2, 0 0 18px rgba(255, 181, 71, 0.8); }
.die.blank { background: var(--panel2); box-shadow: none; }
.die.blank.gone { background: transparent; border: 2px dashed #2a3566; }
.die.dead { opacity: 0.4; }
.die.bonus { background: #d7e9ff; box-shadow: 0 4px 0 #8fb3dd, 0 6px 14px rgba(0, 0, 0, 0.4); border-color: var(--chips); }
.die.bonus.sel { border-color: var(--sel); }
.die.target { outline: 2px dashed var(--chips); outline-offset: 3px; cursor: crosshair; }
.die.changed { animation: pop 0.4s ease-out; }
.die.rolling { animation: tumble 0.45s ease-out; }
@keyframes tumble {
  0% { transform: rotate(-200deg) scale(0.6); opacity: 0.2; }
  70% { transform: rotate(15deg) scale(1.08); }
  100% { transform: rotate(0) scale(1); opacity: 1; }
}
@keyframes pop { 0% { transform: scale(1.3); } 100% { transform: scale(1); } }

/* Middle gap: status and selection */
.middle { display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 10px; text-align: center; min-height: 120px; }
.middle .status { font-size: 16px; color: var(--muted); }
.middle .status b { color: var(--text); }
.middle .status b.bad { color: var(--bad); }
.middle .lock { color: var(--accent); }
.middle .hint { color: var(--muted); font-size: 14px; }
.selinfo .hand { display: inline-block; margin: 3px 4px; background: var(--panel2); padding: 4px 10px; border-radius: 20px; border: 1px solid var(--line); }
.risk { font-size: 13px; color: var(--muted); }
.risk b { color: var(--text); }
.farkle-banner { color: var(--bad); font-weight: 900; font-size: 30px; letter-spacing: 3px; animation: shake 0.4s; }
@keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
.cm { font-variant-numeric: tabular-nums; font-weight: 700; }
.cm .c { color: var(--chips); }
.cm .m { color: var(--mult); }
.t-farkle { color: var(--bad); font-weight: 700; }
.t-launch { color: var(--good); font-weight: 700; }
.t-cache { color: var(--accent); font-weight: 700; }
.t-item { color: var(--chips); }
.why { font-style: italic; }

/* Race track (right column) */
.track { display: flex; flex-direction: column; align-items: center; padding: 8px 0; min-height: 420px; }
.track .tlabel { font-weight: 700; font-size: 15px; }
.track .ttarget { font-size: 36px; font-weight: 800; margin-bottom: 10px; font-variant-numeric: tabular-nums; }
.tline-wrap { flex: 1; width: 100%; position: relative; padding: 4px 0 30px; }
.tline { position: absolute; top: 4px; bottom: 30px; left: 50%; width: 4px; margin-left: -2px; background: var(--text); border-radius: 2px; }
.tick { position: absolute; left: -40px; width: 84px; height: 3px; background: var(--text); transform: translateY(50%); }
.tick span { position: absolute; left: 96px; top: -9px; font-size: 13px; font-weight: 600; white-space: nowrap; }
.trocket {
  position: absolute; width: 40px; height: 68px; background: center / contain no-repeat;
  transform: translateY(50%); transition: bottom 1s cubic-bezier(.3, 1.3, .5, 1);
}
.trocket.me { right: 18px; background-image: var(--rocket-blue); }
.trocket.opp { left: 18px; background-image: var(--rocket-red); }
.track .tzero { font-size: 30px; font-weight: 800; margin-top: -26px; margin-left: 4px; }

/* Dialog content moved off the board */
table.values { width: 100%; border-collapse: collapse; font-size: 14px; }
table.values th, table.values td { padding: 5px 6px; text-align: left; border-bottom: 1px solid var(--line); }
table.values th { color: var(--muted); font-weight: 600; font-size: 11px; text-transform: uppercase; }
table.values td.num { text-align: right; font-variant-numeric: tabular-nums; }
table.values td .boost { color: var(--accent); font-size: 11px; }
.formula { font-size: 13px; color: var(--muted); }
.formula b { color: var(--text); }
.modal h4 { margin: 14px 0 6px; }
.powerups { display: flex; flex-direction: column; gap: 4px; font-size: 13px; }
.powerups .pu { display: flex; justify-content: space-between; gap: 10px; background: var(--bg2); padding: 6px 10px; border-radius: 6px; }
.powerups .pu.off { opacity: 0.4; text-decoration: line-through; }
.log { font-size: 13px; max-height: 220px; overflow: auto; display: flex; flex-direction: column; gap: 3px; }
.log div { padding: 4px 8px; border-radius: 4px; background: var(--bg2); }
.log .r { color: var(--muted); }

/* Overlay / modal */
.overlay {
  position: fixed; inset: 0; background: rgba(5, 8, 18, 0.78); display: flex; align-items: center; justify-content: center;
  z-index: 50; padding: 16px;
}
.overlay[hidden] { display: none; }
.modal {
  background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 18px; width: min(760px, 100%);
  max-height: calc(100vh - 32px); overflow: auto; box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
}
.modal h3 { margin: 0 0 12px; font-size: 20px; }
.modal .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 600px) { .modal .row { grid-template-columns: 1fr; } }
.modal .foot { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
.card { background: var(--bg2); border-radius: 10px; padding: 12px; border: 1px solid var(--line); }
.card h4 { margin: 0 0 8px; display: flex; justify-content: space-between; }
.card.farkle { border-color: var(--bad); }
.card.launch { border-color: var(--good); }
.card .big { font-size: 22px; font-weight: 800; margin: 4px 0; }
.card .steps { list-style: none; margin: 6px 0; padding: 0; font-size: 13px; }
.card .steps li { display: flex; justify-content: space-between; padding: 2px 0; opacity: 0; transform: translateX(-6px); transition: all 0.25s; }
.card .steps li.show { opacity: 1; transform: none; }
.card .resolve { font-size: 24px; font-weight: 900; text-align: center; margin-top: 8px; font-variant-numeric: tabular-nums; }
.card .resolve .total { color: var(--accent); font-size: 32px; display: block; transform: scale(0.4); opacity: 0; transition: all 0.35s cubic-bezier(.3,1.6,.5,1); }
.card .resolve .total.show { transform: scale(1); opacity: 1; }
.card .muted { color: var(--muted); font-size: 13px; }
.card .why { color: var(--muted); font-style: italic; font-size: 12px; }

.winbox { text-align: center; }
.winbox .big { font-size: 34px; font-weight: 900; margin: 6px 0; }
.survey { text-align: left; margin-top: 14px; display: flex; flex-direction: column; gap: 10px; font-size: 14px; }
.survey label { display: flex; flex-direction: column; gap: 4px; }
.survey .scale { display: flex; gap: 6px; flex-wrap: wrap; }
.survey .scale label { flex-direction: row; align-items: center; gap: 3px; }
.survey textarea { background: var(--bg2); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 6px; font: inherit; min-height: 50px; }

.form { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 16px; font-size: 14px; }
@media (max-width: 600px) { .form { grid-template-columns: 1fr; } }
.form label { display: flex; flex-direction: column; gap: 3px; color: var(--muted); }
.form label.inline { flex-direction: row; align-items: center; gap: 8px; color: var(--text); }
.form input[type=number], .form select { background: var(--bg2); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 6px; font: inherit; }
.form h4 { grid-column: 1 / -1; margin: 8px 0 0; color: var(--text); }
table.edit input { width: 64px; background: var(--bg2); color: var(--text); border: 1px solid var(--line); border-radius: 4px; padding: 3px; font: inherit; }

.stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 8px; }
.stat { background: var(--bg2); border-radius: 8px; padding: 10px; }
.stat .v { font-size: 22px; font-weight: 800; }
.stat .k { color: var(--muted); font-size: 12px; }
.stat .pass { color: var(--good); font-size: 12px; }
.stat .fail { color: var(--bad); font-size: 12px; }
.rules { font-size: 14px; line-height: 1.5; }
.rules li { margin-bottom: 4px; }

.card .used { color: var(--chips); font-size: 13px; margin-top: 6px; }
</style>
</head>
<body>
  <header>
    <h1>🚀 Orbital Farkle</h1>
    <div class="meta">
      <span>Round <b id="round">1</b></span>
      <span>Level <b id="level">1</b></span>
      <span id="overtime" hidden><b class="accent">OVERTIME</b></span>
    </div>
    <div class="spacer"></div>
    <div class="tools">
      <button class="hbtn strong" id="btn-values">Hand Values</button>
      <button class="hbtn" id="btn-rules">Rules</button>
      <button class="hbtn" id="btn-tuning">Tuning</button>
      <button class="hbtn" id="btn-stats">Log</button>
      <button class="hbtn ghost" id="btn-restart" title="Start a new run at level 1">New run</button>
    </div>
  </header>

  <main class="board">
    <section class="handsbox opp" id="opp-hands"></section>
    <section class="ship-board opp" id="opp-board"></section>
    <section class="middle" id="middle"></section>
    <section class="handsbox me" id="my-hands"></section>
    <section class="ship-board me" id="my-board"></section>
    <aside class="track" id="track"></aside>
  </main>

  <div class="overlay" id="overlay" hidden>
    <div class="modal" id="modal"></div>
  </div>

  <script>
/*
 * Orbital Farkle — game engine (no DOM).
 * Loaded by index.html via a classic <script> tag, and by sim.js via require().
 */
(function (root) {
  'use strict';

  // ---------------------------------------------------------------------------
  // Config (every value here is a tuning dial; see the Tuning panel in the UI)
  // ---------------------------------------------------------------------------

  const HAND_DEFS = [
    // id, display name, family, base chips, base mult
    { id: 'single1', name: 'Single 1', family: 'single', chips: 10, mult: 1 },
    { id: 'single5', name: 'Single 5', family: 'single', chips: 5, mult: 1 },
    { id: 'twoPair', name: 'Two pair', family: 'set', chips: 25, mult: 3 },
    { id: 'three', name: 'Three of a kind', family: 'set', chips: 30, mult: 3 },
    { id: 'four', name: 'Four of a kind', family: 'set', chips: 60, mult: 4 },
    { id: 'five', name: 'Five of a kind', family: 'set', chips: 100, mult: 5 },
    { id: 'six', name: 'Six of a kind', family: 'set', chips: 150, mult: 7 },
    { id: 'fullHouse', name: 'Full house', family: 'set', chips: 50, mult: 4 },
    { id: 'smallStraight', name: 'Small straight', family: 'run', chips: 30, mult: 3 },
    { id: 'mediumStraight', name: 'Medium straight', family: 'run', chips: 50, mult: 4 },
    { id: 'fullStraight', name: 'Full straight', family: 'run', chips: 80, mult: 6 },
    { id: 'threePairs', name: 'Three pairs', family: 'set', chips: 60, mult: 6 },
    { id: 'twoTriplets', name: 'Two triplets', family: 'set', chips: 100, mult: 7 },
  ];

  const HAND_DICE_TEXT = {
    single1: '1 die (a 1)',
    single5: '1 die (a 5)',
    twoPair: '2 different pairs',
    three: '3 matching',
    four: '4 matching',
    five: '5 matching',
    six: '6 matching',
    fullHouse: '3 matching + a different pair',
    smallStraight: '4 in sequence',
    mediumStraight: '5 in sequence',
    fullStraight: '1-2-3-4-5-6',
    threePairs: '3 pairs (or 4 of a kind + a pair)',
    twoTriplets: '2 different triples',
  };

  function defaultConfig() {
    const hands = {};
    HAND_DEFS.forEach(function (h) {
      hands[h.id] = { chips: h.chips, mult: h.mult };
    });
    return {
      targetScore: 2500,
      // 'pooled': pad resolves as (sum of chips) x (sum of mult), Balatro style.
      // 'perHand': each hand resolves as its own chips x mult, then they are added.
      scoringMode: 'pooled',
      gaugeTiers: 5,
      hotDice: true,
      showFarkleRisk: true,
      autoRoll: true, // roll for the player when rolling is their only option
      hands: hands,
      powerups: {
        single: { enabled: true, chips: 10, appliesTo: ['single1', 'single5'] },
        run: { enabled: true, mult: 2, appliesTo: ['smallStraight', 'mediumStraight'] },
        set: {
          enabled: true,
          xmult: 1.5,
          appliesTo: ['twoPair', 'three', 'four', 'five', 'six', 'fullHouse', 'threePairs', 'twoTriplets'],
        },
      },
      ai: {
        // Launch threshold as a share of the target score, before adjustments.
        baseLaunchShare: 0.2,
        leadingFactor: 0.65, // launch earlier when leading
        trailingMax: 1.8, // launch later when trailing (scaled by how far behind)
        jitter: 0.25, // +/- random spread per burn so the AI is not solvable
        usesItems: true,
      },
      consumables: {
        capacity: 3, // inventory slots per ship
        perLevel: 2, // random items granted at the start of each level (both ships get the same draws)
        earnOnHotDice: false, // hot dice grants one random item (if there is a free slot)
        pool: { nudgeUp: true, nudgeDown: true, reroll: true, intercept: true, copyDie: true },
      },
      levels: {
        multiplier: 1.5, // each level's target = level 1 target x multiplier^(level-1)
      },
    };
  }

  function mergeConfig(base, over) {
    if (!over || typeof over !== 'object') return base;
    const out = Array.isArray(base) ? base.slice() : Object.assign({}, base);
    Object.keys(over).forEach(function (k) {
      const bv = base ? base[k] : undefined;
      const ov = over[k];
      if (bv && typeof bv === 'object' && !Array.isArray(bv) && ov && typeof ov === 'object') {
        out[k] = mergeConfig(bv, ov);
      } else if (ov !== undefined) {
        out[k] = ov;
      }
    });
    return out;
  }

  /** Target score for a level (level 1 = cfg.targetScore). */
  function levelTarget(cfg, level) {
    return Math.round((cfg.targetScore * Math.pow(cfg.levels.multiplier, Math.max(0, level - 1))) / 10) * 10;
  }

  /** The config for one level: same dials, scaled target. */
  function levelConfig(cfg, level) {
    return mergeConfig(cfg, { targetScore: levelTarget(cfg, level) });
  }

  // ---------------------------------------------------------------------------
  // RNG
  // ---------------------------------------------------------------------------

  function makeRng(seed) {
    if (seed === undefined || seed === null) return Math.random;
    let a = seed >>> 0;
    return function () {
      // mulberry32
      a = (a + 0x6d2b79f5) >>> 0;
      let t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function rollDice(n, rng) {
    const out = [];
    for (let i = 0; i < n; i++) out.push(1 + Math.floor(rng() * 6));
    return out;
  }

  // ---------------------------------------------------------------------------
  // Hands and scoring
  // ---------------------------------------------------------------------------

  const HAND_BY_ID = {};
  HAND_DEFS.forEach(function (h) {
    HAND_BY_ID[h.id] = h;
  });

  /** Chips and mult for one hand after the power-up loadout is applied. */
  function handValue(id, cfg) {
    const base = cfg.hands[id];
    let chips = base.chips;
    let mult = base.mult;
    const boosts = [];
    const p = cfg.powerups;
    if (p.single.enabled && p.single.appliesTo.indexOf(id) >= 0) {
      chips += p.single.chips;
      boosts.push('+' + p.single.chips + ' chips');
    }
    if (p.run.enabled && p.run.appliesTo.indexOf(id) >= 0) {
      mult += p.run.mult;
      boosts.push('+' + p.run.mult + ' mult');
    }
    if (p.set.enabled && p.set.appliesTo.indexOf(id) >= 0) {
      mult = mult * p.set.xmult;
      boosts.push('×' + p.set.xmult + ' mult');
    }
    return { chips: chips, mult: round2(mult), boosts: boosts };
  }

  function round2(x) {
    return Math.round(x * 100) / 100;
  }

  function makeHand(id, dice, cfg) {
    const v = handValue(id, cfg);
    return {
      id: id,
      name: HAND_BY_ID[id].name,
      family: HAND_BY_ID[id].family,
      dice: dice.slice().sort(),
      chips: v.chips,
      mult: v.mult,
      label: handLabel(id, dice),
    };
  }

  function handLabel(id, dice) {
    const h = HAND_BY_ID[id];
    if (id === 'twoPair' || id === 'fullHouse') {
      const c = {};
      dice.forEach(function (v) { c[v] = (c[v] || 0) + 1; });
      const faces = Object.keys(c).map(Number).sort();
      if (id === 'twoPair') return h.name + ' (' + faces[0] + 's & ' + faces[1] + 's)';
      const trip = faces.filter(function (f) { return c[f] === 3; })[0];
      const pr = faces.filter(function (f) { return c[f] === 2; })[0];
      return h.name + ' (' + trip + 's over ' + pr + 's)';
    }
    if (h.family === 'set' && id !== 'threePairs' && id !== 'twoTriplets') {
      return h.name + ' (' + dice[0] + 's)';
    }
    if (h.family === 'run') {
      const s = dice.slice().sort();
      return h.name + ' (' + s[0] + '–' + s[s.length - 1] + ')';
    }
    return h.name;
  }

  /**
   * Resolve a list of hands into a launch total.
   * Returns { chips, mult, total, steps[] } where steps describe the reveal.
   */
  function resolvePad(hands, cfg) {
    let chips = 0;
    let mult = 0;
    let perHandTotal = 0;
    const steps = hands.map(function (h) {
      chips += h.chips;
      mult = round2(mult + h.mult);
      const own = Math.round(h.chips * h.mult);
      perHandTotal += own;
      return { label: h.label, chips: h.chips, mult: h.mult, runChips: chips, runMult: mult, own: own, runOwn: perHandTotal };
    });
    const total = cfg.scoringMode === 'perHand' ? perHandTotal : Math.round(chips * mult);
    return { chips: chips, mult: mult, total: total, steps: steps, mode: cfg.scoringMode };
  }

  /**
   * Split a set of selected dice values into scoring hands that use every die.
   * Returns the best-scoring split (array of hands) or null if the selection is not valid.
   */
  function decompose(values, cfg) {
    const n = values.length;
    if (!n) return null;
    const counts = [0, 0, 0, 0, 0, 0, 0];
    values.forEach(function (v) {
      counts[v]++;
    });
    let best = null;
    function consider(list) {
      const s = resolvePad(list, cfg).total;
      if (!best || s > best.score || (s === best.score && list.length < best.list.length)) {
        best = { list: list.slice(), score: s };
      }
    }
    // Single pairs don't score; pairs only count inside two pair, full house and three pairs.
    const kinds = { 3: 'three', 4: 'four', 5: 'five', 6: 'six' };
    const straights = [
      [4, 'smallStraight'],
      [5, 'mediumStraight'],
      [6, 'fullStraight'],
    ];
    const acc = [];
    // Take parts ([[face, count], ...]) out of counts as one hand, recurse, then put them back.
    function tryHand(id, parts) {
      for (let i = 0; i < parts.length; i++) if (counts[parts[i][0]] < parts[i][1]) return;
      const dice = [];
      parts.forEach(function (pt) {
        counts[pt[0]] -= pt[1];
        for (let i = 0; i < pt[1]; i++) dice.push(pt[0]);
      });
      acc.push(makeHand(id, dice, cfg));
      recurse();
      acc.pop();
      parts.forEach(function (pt) {
        counts[pt[0]] += pt[1];
      });
    }
    function recurse() {
      let f = 1;
      while (f <= 6 && counts[f] === 0) f++;
      if (f > 6) {
        consider(acc);
        return;
      }
      // The lowest remaining face must belong to some hand; try every hand containing it.
      if (f === 1 || f === 5) {
        counts[f]--;
        acc.push(makeHand(f === 1 ? 'single1' : 'single5', [f], cfg));
        recurse();
        acc.pop();
        counts[f]++;
      }
      for (let k = 3; k <= Math.min(counts[f], 6); k++) {
        tryHand(kinds[k], [[f, k]]);
      }
      // Multi-face set hands built from f and higher faces g < h.
      for (let g = f + 1; g <= 6; g++) {
        tryHand('twoPair', [[f, 2], [g, 2]]);
        tryHand('fullHouse', [[f, 3], [g, 2]]);
        tryHand('fullHouse', [[f, 2], [g, 3]]);
        tryHand('twoTriplets', [[f, 3], [g, 3]]);
        for (let h = g + 1; h <= 6; h++) tryHand('threePairs', [[f, 2], [g, 2], [h, 2]]);
        // Four of a kind plus a pair also counts as three pairs.
        tryHand('threePairs', [[f, 4], [g, 2]]);
        tryHand('threePairs', [[f, 2], [g, 4]]);
      }
      straights.forEach(function (st) {
        const len = st[0];
        if (f + len - 1 > 6) return;
        for (let i = f; i < f + len; i++) if (!counts[i]) return;
        const dice = [];
        for (let i = f; i < f + len; i++) {
          counts[i]--;
          dice.push(i);
        }
        acc.push(makeHand(st[1], dice, cfg));
        recurse();
        acc.pop();
        for (let i = f; i < f + len; i++) counts[i]++;
      });
    }
    recurse();
    return best ? best.list : null;
  }

  /** True if any subset of the roll scores (i.e. the roll is not a farkle). */
  function hasScoring(values) {
    const counts = [0, 0, 0, 0, 0, 0, 0];
    values.forEach(function (v) {
      counts[v]++;
    });
    if (counts[1] || counts[5]) return true;
    let pairs = 0;
    for (let f = 1; f <= 6; f++) {
      if (counts[f] >= 3) return true;
      if (counts[f] >= 2) pairs++;
    }
    if (pairs >= 2) return true; // two pair
    for (let s = 1; s <= 3; s++) {
      if (counts[s] && counts[s + 1] && counts[s + 2] && counts[s + 3]) return true;
    }
    return false;
  }

  /** Exact probability that rolling n dice is a farkle. */
  const farkleCache = {};
  function farkleChance(n) {
    if (n <= 0) return 0;
    if (farkleCache[n] !== undefined) return farkleCache[n];
    let bad = 0;
    const total = Math.pow(6, n);
    const vals = new Array(n).fill(1);
    for (let i = 0; i < total; i++) {
      let x = i;
      for (let d = 0; d < n; d++) {
        vals[d] = (x % 6) + 1;
        x = Math.floor(x / 6);
      }
      if (!hasScoring(vals)) bad++;
    }
    farkleCache[n] = bad / total;
    return farkleCache[n];
  }

  /** All valid cache options for a roll: [{ idx:[...], hands:[...] }]. */
  function cacheOptions(values, cfg) {
    const out = [];
    const n = values.length;
    for (let mask = 1; mask < 1 << n; mask++) {
      const idx = [];
      for (let i = 0; i < n; i++) if (mask & (1 << i)) idx.push(i);
      const hands = decompose(
        idx.map(function (i) {
          return values[i];
        }),
        cfg
      );
      if (hands) out.push({ idx: idx, hands: hands });
    }
    return out;
  }

  // ---------------------------------------------------------------------------
  // Thrust gauge (coarse tiers)
  // ---------------------------------------------------------------------------

  const TIER_NAMES_5 = ['Cold', 'Spark', 'Burn', 'Roar', 'Inferno'];

  function gaugeThresholds(cfg) {
    const n = Math.max(2, cfg.gaugeTiers | 0);
    const out = [];
    // Tier 0 = empty pad. Tiers 1..n-1 start at target * (k/n)^1.5
    for (let k = 1; k < n; k++) out.push(cfg.targetScore * Math.pow(k / n, 1.5));
    return out;
  }

  /** A rough pad value from a gauge reading: the middle of its tier (the floor of the top tier). */
  function gaugeEstimate(g, cfg) {
    if (!g.tier) return 0;
    const th = gaugeThresholds(cfg);
    const lo = g.tier === 1 ? 0 : th[g.tier - 2];
    const hi = g.tier - 1 < th.length ? th[g.tier - 1] : null;
    return hi === null ? lo : (lo + hi) / 2;
  }

  function gaugeTier(total, handsCount, cfg) {
    if (!handsCount) return { tier: 0, of: cfg.gaugeTiers, name: 'Empty' };
    const th = gaugeThresholds(cfg);
    let t = 1;
    for (let i = 0; i < th.length; i++) if (total >= th[i]) t = i + 2;
    const n = cfg.gaugeTiers;
    const name = n === 5 ? TIER_NAMES_5[t - 1] : 'Tier ' + t;
    return { tier: t, of: n, name: name };
  }

  // ---------------------------------------------------------------------------
  // Consumables
  // ---------------------------------------------------------------------------

  const CONSUMABLE_DEFS = [
    { id: 'nudgeUp', name: 'Nudge up', icon: '▲', kind: 'self', target: 'ownDie', desc: 'Raise one of your dice by 1 (6 wraps to 1).' },
    { id: 'nudgeDown', name: 'Nudge down', icon: '▼', kind: 'self', target: 'ownDie', desc: 'Lower one of your dice by 1 (1 wraps to 6).' },
    { id: 'reroll', name: 'Reroll', icon: '↻', kind: 'self', target: 'ownDie', desc: 'Reroll one of your dice.' },
    { id: 'intercept', name: 'Intercept', icon: '⧉', kind: 'opponent', target: 'oppHand', desc: "Copy one hand from the opponent's pad onto yours. Theirs stays intact." },
    { id: 'copyDie', name: 'Copy die', icon: '⎘', kind: 'opponent', target: 'oppDie', desc: "Copy one of the opponent's dice from this round's roll into your roll as a bonus die." },
  ];
  const CONSUMABLE_BY_ID = {};
  CONSUMABLE_DEFS.forEach(function (c) {
    CONSUMABLE_BY_ID[c.id] = c;
  });
  // Items that can turn a farkle into a scoring roll.
  const RESCUE_ITEMS = ['nudgeUp', 'nudgeDown', 'reroll', 'copyDie'];

  function wrapDie(v) {
    return ((v - 1 + 6) % 6) + 1;
  }

  // ---------------------------------------------------------------------------
  // Match
  // ---------------------------------------------------------------------------

  function emptyInventory() {
    const inv = {};
    CONSUMABLE_DEFS.forEach(function (c) {
      inv[c.id] = 0;
    });
    return inv;
  }

  function inventoryCount(inv) {
    return Object.keys(inv).reduce(function (n, k) {
      return n + (inv[k] || 0);
    }, 0);
  }

  function newSide(id, cfg) {
    return {
      id: id,
      banked: 0,
      pad: [],
      available: 6,
      dice: [], // current roll values (may include bonus dice)
      bonus: [], // bonus[i] true when dice[i] was copied from the opponent
      rolled: null, // this round's roll as rolled, before any items (visible to the opponent)
      items: [], // consumables used this turn
      inventory: emptyInventory(),
      burn: null, // active burn info for logging
      lastTurn: null,
    };
  }

  function Match(cfg, opts) {
    opts = opts || {};
    this.cfg = cfg;
    this.rng = opts.rng || Math.random;
    this.round = 0;
    this.player = newSide('player', cfg);
    this.ai = newSide('ai', cfg);
    this.over = false;
    this.winner = null;
    this.overtime = false;
    this.aiPlan = null;
    this.padAtRoundStart = { player: [], ai: [] };
    this.level = opts.level || 1;
    this.log = { burns: [], rounds: [], items: [], startedAt: Date.now() };
    // Leftover items carry over from the previous level, then both ships draw the same new items.
    const carry = opts.carry || {};
    if (carry.player) this.player.inventory = Object.assign(emptyInventory(), carry.player);
    if (carry.ai) this.ai.inventory = Object.assign(emptyInventory(), carry.ai);
    this.levelGrants = []; // items drawn this level
    this.levelLost = { player: [], ai: [] }; // drawn items that didn't fit in a full inventory
    for (let k = 0; k < cfg.consumables.perLevel; k++) {
      const id = this.drawItem();
      if (!id) break;
      this.levelGrants.push(id);
      [this.player, this.ai].forEach(function (sd) {
        if (!this.giveItem(sd, id)) this.levelLost[sd.id].push(id);
      }, this);
    }
  }

  Match.prototype.other = function (side) {
    return side === this.player ? this.ai : this.player;
  };

  Match.prototype.padTotal = function (side) {
    return resolvePad(side.pad, this.cfg).total;
  };

  Match.prototype.gauge = function (side) {
    return gaugeTier(this.padTotal(side), side.pad.length, this.cfg);
  };

  Match.prototype.beginRound = function () {
    this.round++;
    [this.player, this.ai].forEach(function (s) {
      s.items = [];
      s.rolled = null;
      s.dice = [];
      s.bonus = [];
    });
    // Intercept copies from the opponent's pad as it stood when the round began.
    this.padAtRoundStart = { player: this.player.pad.slice(), ai: this.ai.pad.slice() };
    // The AI commits before it sees anything the player does this round.
    this.aiPlan = aiDecide(this, this.ai, this.player);
  };

  Match.prototype.ensureBurn = function (side) {
    if (!side.burn) {
      const o = this.other(side);
      side.burn = {
        side: side.id,
        startRound: this.round,
        caches: 0,
        rolls: 0,
        hotDice: 0,
        items: 0,
        diffAtStart: side.banked - o.banked,
        jitter: 1 + (this.rng() * 2 - 1) * this.cfg.ai.jitter,
      };
    }
    return side.burn;
  };

  Match.prototype.roll = function (side) {
    this.ensureBurn(side).rolls++;
    side.dice = rollDice(side.available, this.rng);
    side.bonus = side.dice.map(function () { return false; });
    side.rolled = side.dice.slice();
    return { values: side.dice.slice(), farkle: !hasScoring(side.dice) };
  };

  Match.prototype.isFarkle = function (side) {
    return !hasScoring(side.dice);
  };

  /** Number of live (non-bonus) dice among the given indices. */
  Match.prototype.liveCount = function (side, idx) {
    return idx.filter(function (i) { return !side.bonus[i]; }).length;
  };

  // --- consumable use. Each returns a description object, or null if not allowed. ---

  Match.prototype.canUse = function (side, id) {
    if (!(side.inventory[id] > 0)) return false;
    const opp = this.other(side);
    if (id === 'intercept') return this.padAtRoundStart[opp.id].length > 0;
    if (id === 'copyDie') return side.dice.length > 0 && !!opp.rolled && opp.rolled.length > 0;
    return side.dice.length > 0; // nudges and reroll need a roll in front of you
  };

  Match.prototype.spend = function (side, id, detail) {
    side.inventory[id]--;
    const rec = Object.assign({ id: id, name: CONSUMABLE_BY_ID[id].name, icon: CONSUMABLE_BY_ID[id].icon }, detail);
    side.items.push(rec);
    this.ensureBurn(side).items++;
    this.log.items.push(Object.assign({ side: side.id, round: this.round }, rec));
    return rec;
  };

  Match.prototype.useNudge = function (side, i, dir) {
    const id = dir > 0 ? 'nudgeUp' : 'nudgeDown';
    if (!this.canUse(side, id) || i < 0 || i >= side.dice.length) return null;
    const from = side.dice[i];
    side.dice[i] = wrapDie(from + dir);
    return this.spend(side, id, { from: from, to: side.dice[i], text: from + ' → ' + side.dice[i] });
  };

  Match.prototype.useReroll = function (side, i) {
    if (!this.canUse(side, 'reroll') || i < 0 || i >= side.dice.length) return null;
    const from = side.dice[i];
    side.dice[i] = rollDice(1, this.rng)[0];
    return this.spend(side, 'reroll', { from: from, to: side.dice[i], text: from + ' → ' + side.dice[i] });
  };

  Match.prototype.useCopyDie = function (side, oppIdx) {
    const opp = this.other(side);
    if (!this.canUse(side, 'copyDie') || oppIdx < 0 || oppIdx >= opp.rolled.length) return null;
    const v = opp.rolled[oppIdx];
    side.dice.push(v);
    side.bonus.push(true);
    return this.spend(side, 'copyDie', { value: v, text: 'copied a ' + v });
  };

  Match.prototype.useIntercept = function (side, handIdx) {
    const opp = this.other(side);
    const src = this.padAtRoundStart[opp.id];
    if (!this.canUse(side, 'intercept') || handIdx < 0 || handIdx >= src.length) return null;
    const h = Object.assign({}, src[handIdx], { copied: true });
    side.pad = side.pad.concat([h]);
    return this.spend(side, 'intercept', { hand: h.label, text: 'copied ' + h.label });
  };

  /** A random item id from the enabled pool, or null if the pool is empty. */
  Match.prototype.drawItem = function () {
    const pool = this.cfg.consumables.pool;
    const ids = CONSUMABLE_DEFS.map(function (c) { return c.id; }).filter(function (id) {
      return pool[id];
    });
    if (!ids.length) return null;
    return ids[Math.floor(this.rng() * ids.length)];
  };

  /** Add an item if the ship has a free inventory slot. Returns true if it fit. */
  Match.prototype.giveItem = function (side, id) {
    if (inventoryCount(side.inventory) >= this.cfg.consumables.capacity) return false;
    side.inventory[id] = (side.inventory[id] || 0) + 1;
    return true;
  };

  Match.prototype.grantRandomItem = function (side) {
    const id = this.drawItem();
    return id && this.giveItem(side, id) ? id : null;
  };

  /** Cache the dice at the given indices of the current roll. Returns the turn record or null if invalid. */
  Match.prototype.cache = function (side, idx) {
    const vals = idx.map(function (i) {
      return side.dice[i];
    });
    const hands = decompose(vals, this.cfg);
    if (!hands) return null;
    const roll = side.rolled ? side.rolled.slice() : side.dice.slice();
    const finalDice = side.dice.slice();
    side.pad = side.pad.concat(hands);
    // Bonus (copied) dice don't come out of your live dice.
    side.available -= this.liveCount(side, idx);
    const burn = this.ensureBurn(side);
    burn.caches++;
    let hot = false;
    let earned = null;
    if (side.available === 0 && this.cfg.hotDice) {
      side.available = 6;
      burn.hotDice++;
      hot = true;
      if (this.cfg.consumables.earnOnHotDice) earned = this.grantRandomItem(side);
    }
    side.dice = [];
    side.bonus = [];
    return { type: 'cache', roll: roll, finalDice: finalDice, kept: idx.slice(), hands: hands, hot: hot, earned: earned, diceLeft: side.available };
  };

  Match.prototype.farkle = function (side) {
    const lost = resolvePad(side.pad, this.cfg);
    const handsLost = side.pad.slice();
    const roll = side.rolled ? side.rolled.slice() : side.dice.slice();
    const finalDice = side.dice.slice();
    this.endBurn(side, 'farkle', lost.total);
    side.pad = [];
    side.available = 6;
    side.dice = [];
    side.bonus = [];
    return { type: 'farkle', roll: roll, finalDice: finalDice, lost: lost, handsLost: handsLost };
  };

  Match.prototype.launch = function (side) {
    const res = resolvePad(side.pad, this.cfg);
    const hands = side.pad.slice();
    const before = side.banked;
    this.endBurn(side, 'launch', res.total);
    side.banked += res.total;
    side.pad = [];
    side.available = 6;
    side.dice = [];
    side.bonus = [];
    return { type: 'launch', resolution: res, hands: hands, before: before, after: side.banked };
  };

  Match.prototype.endBurn = function (side, outcome, total) {
    const b = side.burn;
    if (!b) return;
    const o = this.other(side);
    b.outcome = outcome;
    b.total = total;
    b.endRound = this.round;
    b.diffAtEnd = side.banked - o.banked;
    b.trailing = b.diffAtEnd < 0;
    this.log.burns.push(b);
    side.burn = null;
  };

  /**
   * Roll for the AI now if it committed to rolling. Called when the player rolls so both
   * rolls are revealed together and each side can see (and copy from) the other's dice.
   */
  Match.prototype.aiRollIfPlanned = function () {
    if (this.aiPlan && this.aiPlan.type === 'roll' && !this.ai.rolled) this.roll(this.ai);
  };

  /** Player commits a full turn (a record from cache(), farkle() or launch()). */
  Match.prototype.resolveRound = function (playerTurnRecord) {
    const aiTurn = executeAiPlan(this, this.ai, this.aiPlan);
    const pTurn = playerTurnRecord;
    pTurn.items = this.player.items.slice();
    this.player.lastTurn = pTurn;
    this.ai.lastTurn = aiTurn;

    const t = this.cfg.targetScore;
    const pR = this.player.banked >= t;
    const aR = this.ai.banked >= t;
    let result = null;
    if (this.overtime) {
      if (this.player.banked !== this.ai.banked) result = this.player.banked > this.ai.banked ? 'player' : 'ai';
    } else if (pR && aR) {
      // Both reached orbit in the same round: a tie, so another round is played.
      // From then on the higher banked score at the end of a round wins.
      this.overtime = true;
      result = 'tie';
    } else if (pR) result = 'player';
    else if (aR) result = 'ai';

    const rec = {
      round: this.round,
      player: summarizeTurn(pTurn),
      ai: summarizeTurn(aiTurn),
      playerBanked: this.player.banked,
      aiBanked: this.ai.banked,
    };
    this.log.rounds.push(rec);

    if (result === 'player' || result === 'ai') {
      this.over = true;
      this.winner = result;
      // close any open burns so they are logged
      [this.player, this.ai].forEach(function (s) {
        if (s.burn) this.endBurn(s, 'matchEnd', this.padTotal(s));
      }, this);
      this.log.endedAt = Date.now();
    }
    return { player: pTurn, ai: aiTurn, result: result, round: this.round };
  };

  function summarizeTurn(t) {
    if (!t) return null;
    const items = (t.items || []).map(function (i) { return i.name + ' (' + i.text + ')'; });
    let s;
    if (t.type === 'cache') s = { type: 'cache', roll: t.roll, hands: t.hands.map(function (h) { return h.label; }), hot: t.hot };
    else if (t.type === 'farkle') s = { type: 'farkle', roll: t.roll, lost: t.lost.total };
    else if (t.type === 'launch') s = { type: 'launch', total: t.resolution.total };
    else s = { type: t.type };
    s.items = items;
    s.reason = t.reason;
    return s;
  }

  // ---------------------------------------------------------------------------
  // AI: readable heuristic. Keeps rolling when trailing, launches earlier when leading.
  // ---------------------------------------------------------------------------

  function aiDecide(match, me, opp) {
    const cfg = match.cfg;
    if (!me.pad.length) return { type: 'roll', reason: 'Pad is empty' };
    if (me.available === 0) return { type: 'launch', reason: 'No dice left' };
    const pad = match.padTotal(me);
    const need = cfg.targetScore - me.banked;
    if (pad >= need) return { type: 'launch', reason: 'Pad reaches orbit' };

    // Judge the race on projected scores: banked plus a read of the pad gauge, so a big
    // unbanked pad on the other ship counts as a threat even before it launches.
    const oppEst = opp.banked + gaugeEstimate(match.gauge(opp), cfg);
    const lead = me.banked + pad - oppEst;

    // The opponent could reach orbit on their next launch. Banking short of orbit won't
    // stop them, so race for a pad that gets us there, unless the next roll is very risky.
    if (oppEst >= cfg.targetScore) {
      const rescues = cfg.ai.usesItems ? (me.inventory.nudgeUp || 0) + (me.inventory.nudgeDown || 0) + (me.inventory.reroll || 0) : 0;
      if (farkleChance(me.available) >= 0.4 && !rescues) return { type: 'launch', reason: 'They are near orbit and my dice are thin: banking' };
      return { type: 'roll', reason: 'They are near orbit: racing to get there first' };
    }

    let threshold = cfg.targetScore * cfg.ai.baseLaunchShare;
    if (lead > 0) threshold *= cfg.ai.leadingFactor;
    else if (lead < 0) threshold *= 1 + Math.min(1, (-lead / cfg.targetScore) * 2) * (cfg.ai.trailingMax - 1);

    // Few dice left means a high farkle chance on the next roll. Rescue items soften that.
    let risk = farkleChance(me.available);
    const rescues = (me.inventory.nudgeUp || 0) + (me.inventory.nudgeDown || 0) + (me.inventory.reroll || 0);
    if (cfg.ai.usesItems && rescues > 0) risk *= 0.5;
    if (risk >= 0.5) threshold *= 0.45;
    else if (risk >= 0.25) threshold *= 0.65;
    else if (risk >= 0.1) threshold *= 0.85;

    threshold *= me.burn ? me.burn.jitter : 1;
    if (threshold > need) threshold = need;
    if (pad >= threshold) return { type: 'launch', reason: lead > 0 ? 'Ahead: banking early' : 'Pad is big enough' };
    return { type: 'roll', reason: lead < 0 ? 'Behind: pressing on' : 'Building thrust' };
  }

  /**
   * Pick the AI's cache from a roll. values/bonus describe the dice; live = live dice count this roll.
   * Returns { opt, score, hot } or null if nothing scores.
   */
  function aiEvalCache(match, me, values, bonus) {
    const cfg = match.cfg;
    const opts = cacheOptions(values, cfg);
    if (!opts.length) return null;
    const live = me.available;
    const cur = resolvePad(me.pad, cfg).total;
    function liveUsed(o) {
      return o.idx.filter(function (i) { return !bonus[i]; }).length;
    }
    function gain(o) {
      return resolvePad(me.pad.concat(o.hands), cfg).total - cur;
    }
    // Hot dice whenever possible: it resets to six dice.
    if (cfg.hotDice) {
      let hotBest = null;
      opts.forEach(function (o) {
        if (liveUsed(o) === live) {
          const g = gain(o);
          if (!hotBest || g > hotBest.score) hotBest = { opt: o, score: g, hot: true };
        }
      });
      if (hotBest) {
        hotBest.score += cfg.targetScore * 0.08; // six fresh dice are worth a lot
        return hotBest;
      }
    }
    // Otherwise prefer keeping at least 3 dice live, taking the best gain; if impossible take everything we can.
    const keep3 = opts.filter(function (o) {
      return live - liveUsed(o) >= 3;
    });
    const pool = keep3.length ? keep3 : opts;
    let best = null;
    pool.forEach(function (o) {
      // value gain, minus a small cost for each live die spent (dice are future rolls)
      const used = liveUsed(o);
      const s = gain(o) - (keep3.length ? used * cfg.targetScore * 0.004 : -used);
      if (!best || s > best.score) best = { opt: o, score: s, hot: false };
    });
    return best;
  }

  function aiChooseCache(match, me, values) {
    const bonus = me.bonus && me.bonus.length === values.length ? me.bonus : values.map(function () { return false; });
    const r = aiEvalCache(match, me, values, bonus);
    return r ? r.opt : null;
  }

  /**
   * Candidate deterministic item uses on the current roll: nudges on each die and copying each opponent die.
   * Each candidate is { id, arg, dice, bonus }.
   */
  function aiItemCandidates(match, me) {
    const out = [];
    const opp = match.other(me);
    [['nudgeUp', 1], ['nudgeDown', -1]].forEach(function (pair) {
      if (!(me.inventory[pair[0]] > 0)) return;
      me.dice.forEach(function (v, i) {
        const d = me.dice.slice();
        d[i] = wrapDie(v + pair[1]);
        out.push({ id: pair[0], arg: i, dice: d, bonus: me.bonus.slice() });
      });
    });
    if (me.inventory.copyDie > 0 && opp.rolled && opp.rolled.length) {
      const seen = {};
      opp.rolled.forEach(function (v, j) {
        if (seen[v]) return;
        seen[v] = true;
        out.push({ id: 'copyDie', arg: j, dice: me.dice.concat([v]), bonus: me.bonus.concat([true]) });
      });
    }
    return out;
  }

  function aiApply(match, me, c) {
    if (c.id === 'nudgeUp') return match.useNudge(me, c.arg, 1);
    if (c.id === 'nudgeDown') return match.useNudge(me, c.arg, -1);
    if (c.id === 'copyDie') return match.useCopyDie(me, c.arg);
    if (c.id === 'reroll') return match.useReroll(me, c.arg);
    return null;
  }

  /** Try to turn a farkle into a scoring roll. Prefers sure things (nudge, copy) over a reroll gamble. */
  function aiRescue(match, me) {
    let best = null;
    aiItemCandidates(match, me).forEach(function (c) {
      const r = aiEvalCache(match, me, c.dice, c.bonus);
      if (r && (!best || r.score > best.score)) best = { c: c, score: r.score };
    });
    if (best) {
      aiApply(match, me, best.c);
      return true;
    }
    // Gamble with rerolls while we have them.
    while (me.inventory.reroll > 0 && match.isFarkle(me)) {
      match.useReroll(me, Math.floor(match.rng() * me.dice.length));
    }
    return !match.isFarkle(me);
  }

  /** Spend at most one item to improve a good roll, but only when it is clearly worth it. */
  function aiImprove(match, me) {
    const base = aiEvalCache(match, me, me.dice, me.bonus);
    if (!base) return;
    // Nudges are saved for farkle rescues unless the AI holds a spare of that kind.
    let best = null;
    aiItemCandidates(match, me).forEach(function (c) {
      if (c.id !== 'copyDie' && me.inventory[c.id] < 2) return;
      const r = aiEvalCache(match, me, c.dice, c.bonus);
      if (!r) return;
      const lift = r.score - base.score;
      const worth = (r.hot && !base.hot) || lift >= Math.max(match.cfg.targetScore * 0.03, Math.abs(base.score) * 0.6);
      if (worth && (!best || lift > best.lift)) best = { c: c, lift: lift };
    });
    if (best) aiApply(match, me, best.c);
  }

  /** Copy the best hand from the opponent's pad when it is big, or when trailing. */
  function aiMaybeIntercept(match, me) {
    if (!match.canUse(me, 'intercept')) return;
    const opp = match.other(me);
    const src = match.padAtRoundStart[opp.id];
    let bestI = -1;
    let bestGain = 0;
    const cur = resolvePad(me.pad, match.cfg).total;
    src.forEach(function (h, i) {
      const g = resolvePad(me.pad.concat([h]), match.cfg).total - cur;
      if (g > bestGain) {
        bestGain = g;
        bestI = i;
      }
    });
    const trailing = me.banked < opp.banked;
    const big = src[bestI] && src[bestI].chips * src[bestI].mult >= (trailing ? 45 : 90);
    if (bestI >= 0 && big) match.useIntercept(me, bestI);
  }

  function executeAiPlan(match, me, plan) {
    const useItems = match.cfg.ai.usesItems;
    let turn;
    if (useItems) aiMaybeIntercept(match, me);
    if (plan.type === 'launch') {
      turn = match.launch(me);
    } else {
      if (!me.rolled) match.roll(me);
      if (match.isFarkle(me) && useItems) aiRescue(match, me);
      if (match.isFarkle(me)) {
        turn = match.farkle(me);
      } else {
        if (useItems) aiImprove(match, me);
        const r = aiEvalCache(match, me, me.dice, me.bonus);
        turn = match.cache(me, r.opt.idx);
      }
    }
    turn.reason = plan.reason;
    turn.items = me.items.slice();
    return turn;
  }

  // ---------------------------------------------------------------------------

  const api = {
    HAND_DEFS: HAND_DEFS,
    HAND_DICE_TEXT: HAND_DICE_TEXT,
    CONSUMABLE_DEFS: CONSUMABLE_DEFS,
    RESCUE_ITEMS: RESCUE_ITEMS,
    defaultConfig: defaultConfig,
    levelTarget: levelTarget,
    levelConfig: levelConfig,
    inventoryCount: inventoryCount,
    gaugeEstimate: gaugeEstimate,
    mergeConfig: mergeConfig,
    makeRng: makeRng,
    rollDice: rollDice,
    handValue: handValue,
    resolvePad: resolvePad,
    decompose: decompose,
    hasScoring: hasScoring,
    farkleChance: farkleChance,
    cacheOptions: cacheOptions,
    gaugeTier: gaugeTier,
    gaugeThresholds: gaugeThresholds,
    Match: Match,
    aiDecide: aiDecide,
    aiChooseCache: aiChooseCache,
    executeAiPlan: executeAiPlan,
  };

  if (typeof module !== 'undefined' && module.exports) module.exports = api;
  else root.OF = api;
})(this);
</script>
  <script>
/* Orbital Farkle — browser UI. Depends on engine.js (window.OF). */
(function () {
  'use strict';

  const OF = window.OF;
  const $ = function (id) { return document.getElementById(id); };
  const fmt = function (n) { return Math.round(n).toLocaleString(); };

  // ---------------------------------------------------------------------------
  // Persistence (localStorage is best-effort: the game works without it)
  // ---------------------------------------------------------------------------

  const LS_CONFIG = 'orbitalFarkle.config.v1';
  const LS_LOGS = 'orbitalFarkle.logs.v1';
  const LS_TESTER = 'orbitalFarkle.tester.v1';

  function lsGet(key, fallback) {
    try {
      const raw = localStorage.getItem(key);
      return raw ? JSON.parse(raw) : fallback;
    } catch (e) {
      return fallback;
    }
  }
  function lsSet(key, val) {
    try {
      localStorage.setItem(key, JSON.stringify(val));
    } catch (e) { /* ignore */ }
  }

  function loadConfig() {
    return OF.mergeConfig(OF.defaultConfig(), lsGet(LS_CONFIG, null));
  }

  // ---------------------------------------------------------------------------
  // State
  // ---------------------------------------------------------------------------

  let cfg = loadConfig();
  let match = null;
  let phase = 'choose'; // choose | select | farkled | reveal | over
  let selected = [];
  let pendingPlayerTurn = null;
  let rolledFresh = false;
  let matchSaved = false;
  let targeting = null; // consumable id waiting for the player to pick a target
  let changedDie = -1; // die index to flash after an item changed it
  const roundLog = [];
  const ITEM = {};
  OF.CONSUMABLE_DEFS.forEach(function (c) { ITEM[c.id] = c; });

  let level = 1;
  let runId = '';

  /** Start a fresh run at level 1 with empty inventories. */
  function newRun() {
    runId = Date.now().toString(36);
    startLevel(1, null);
  }

  /** After a level ends: a win moves on to the next level (items carry over); a loss starts a new run. */
  function continueRun() {
    if (match.winner === 'player') {
      startLevel(level + 1, { player: Object.assign({}, match.player.inventory), ai: Object.assign({}, match.ai.inventory) });
    } else {
      newRun();
    }
  }

  function startLevel(lv, carry) {
    if (match && !matchSaved && match.round > 1) saveMatch(true);
    level = lv;
    cfg = OF.levelConfig(loadConfig(), lv);
    match = new OF.Match(cfg, { level: lv, carry: carry });
    matchSaved = false;
    roundLog.length = 0;
    selected = [];
    pendingPlayerTurn = null;
    targeting = null;
    match.beginRound();
    phase = 'choose';
    closeModal();
    render();
    if ($('overlay').hidden && lsGet('orbitalFarkle.seenRules', false)) showLevelIntro();
  }

  function showLevelIntro() {
    const grants = match.levelGrants.map(function (id) { return ITEM[id].icon + ' ' + ITEM[id].name; });
    const cap = cfg.consumables.capacity;
    openModal(
      '<div class="winbox"><h3>Level ' + level + '</h3>' +
      '<div class="big">Orbit at ' + fmt(cfg.targetScore) + '</div>' +
      '<p>' + (grants.length ? 'Both ships drew: <b>' + grants.join(', ') + '</b>.' : 'No new items this level.') + '<br>' +
      (match.levelLost.player.length ? '<span style="color:var(--bad)">Your inventory was full, so you lost: ' + match.levelLost.player.map(function (id) { return ITEM[id].name; }).join(', ') + '.</span><br>' : '') +
      '<span style="color:var(--muted)">Inventory: ' + OF.inventoryCount(match.player.inventory) + '/' + cap + ' slots (drawn items that don\u2019t fit are lost).</span></p></div>' +
      '<div class="foot"><button class="primary" id="l-go">Start level<kbd>Enter</kbd></button></div>',
      closeModal
    );
    bind('l-go', closeModal);
  }

  // ---------------------------------------------------------------------------
  // Player actions
  // ---------------------------------------------------------------------------

  function onRoll() {
    if (phase !== 'choose' || match.player.available === 0) return;
    match.roll(match.player);
    // Both ships roll together, so each can see (and copy from) the other's dice.
    match.aiRollIfPlanned();
    selected = [];
    targeting = null;
    rolledFresh = true;
    phase = match.isFarkle(match.player) ? 'farkled' : 'select';
    render();
    rolledFresh = false;
  }

  function onLaunch() {
    if (phase !== 'choose' || !match.player.pad.length) return;
    targeting = null;
    commit(match.launch(match.player));
  }

  function onCache() {
    if (phase !== 'select' || !currentSelection()) return;
    const turn = match.cache(match.player, selected.slice().sort());
    if (turn) commit(turn);
  }

  function onFarkleContinue() {
    if (phase !== 'farkled') return;
    targeting = null;
    commit(match.farkle(match.player));
  }

  function toggleDie(i) {
    if (i >= match.player.dice.length) return;
    if (targeting && ITEM[targeting].target === 'ownDie') return applyItem(i);
    if (phase !== 'select') return;
    const at = selected.indexOf(i);
    if (at >= 0) selected.splice(at, 1);
    else selected.push(i);
    render();
  }

  // --- consumables ---

  function itemPhaseOk(id) {
    if (ITEM[id].target === 'oppHand') return phase === 'choose' || phase === 'select' || phase === 'farkled';
    return phase === 'select' || phase === 'farkled';
  }

  function itemUsable(id) {
    return itemPhaseOk(id) && match.canUse(match.player, id);
  }

  function hasRescue() {
    return OF.RESCUE_ITEMS.some(function (id) { return match.canUse(match.player, id); });
  }

  function onItem(id) {
    if (!itemUsable(id)) return;
    targeting = targeting === id ? null : id;
    render();
  }

  function applyItem(arg) {
    const p = match.player;
    const id = targeting;
    targeting = null;
    let rec = null;
    if (id === 'nudgeUp') rec = match.useNudge(p, arg, 1);
    else if (id === 'nudgeDown') rec = match.useNudge(p, arg, -1);
    else if (id === 'reroll') rec = match.useReroll(p, arg);
    else if (id === 'copyDie') rec = match.useCopyDie(p, arg);
    else if (id === 'intercept') rec = match.useIntercept(p, arg);
    if (rec) {
      changedDie = id === 'copyDie' ? p.dice.length - 1 : id === 'intercept' ? -1 : arg;
      selected = [];
      if (phase === 'select' || phase === 'farkled') phase = match.isFarkle(p) ? 'farkled' : 'select';
    }
    render();
    changedDie = -1;
  }

  // --- auto-roll ---

  let autoRollTimer = null;

  /** True when it's the player's move and rolling is the only thing they can do. */
  function onlyRollPossible() {
    const p = match.player;
    return phase === 'choose' && p.available > 0 && !p.pad.length && !itemUsable('intercept');
  }

  /** Roll for the player after a short beat, once no dialog is open. */
  function maybeAutoRoll() {
    if (!cfg.autoRoll || autoRollTimer || !onlyRollPossible() || !$('overlay').hidden) return;
    autoRollTimer = setTimeout(function () {
      autoRollTimer = null;
      if (onlyRollPossible() && $('overlay').hidden) onRoll();
    }, 600);
  }

  function currentSelection() {
    if (!selected.length) return null;
    return OF.decompose(selected.map(function (i) { return match.player.dice[i]; }), cfg);
  }

  function commit(turn) {
    pendingPlayerTurn = turn;
    const res = match.resolveRound(turn);
    roundLog.push(res);
    phase = 'reveal';
    render();
    showReveal(res);
  }

  function afterReveal() {
    closeModal();
    if (match.over) {
      phase = 'over';
      if (!matchSaved) saveMatch(false);
      render();
      showGameOver();
      return;
    }
    match.beginRound();
    phase = 'choose';
    render();
  }

  // ---------------------------------------------------------------------------
  // Rendering
  // ---------------------------------------------------------------------------

  // Short labels for item tiles.
  const ITEM_LABEL = { nudgeUp: '+1', nudgeDown: '−1', reroll: 'Reroll', intercept: 'Intercept', copyDie: 'Copy' };

  function render() {
    $('level').textContent = level;
    $('round').textContent = match.round;
    $('overtime').hidden = !match.overtime;
    renderHands($('opp-hands'), match.ai, false);
    renderHands($('my-hands'), match.player, true);
    renderOppBoard();
    renderMiddle();
    renderMyBoard();
    renderTrack();
    maybeAutoRoll();
  }

  function gaugeHtml(side, label) {
    const g = match.gauge(side);
    let segs = '';
    for (let i = 0; i < g.of; i++) segs += '<div class="seg' + (i < g.tier ? ' on' : '') + '"></div>';
    return '<div class="gauge" title="' + g.name + '"><span class="glabel">' + label + '</span><div class="segs">' + segs + '</div></div>';
  }

  /** "Velocity: banked / target" with a 10-segment progress bar. */
  function velocityHtml(side, who) {
    const n = 10;
    const on = Math.min(n, Math.floor((side.banked / cfg.targetScore) * n));
    let segs = '';
    for (let i = 0; i < n; i++) segs += '<div class="seg' + (i < on ? ' on' : '') + '"></div>';
    return '<div class="velocity ' + who + '"><span class="rocket-ico ' + who + '"></span>' +
      '<span class="vlabel">Velocity: ' + fmt(side.banked) + ' / ' + fmt(cfg.targetScore) + '</span><div class="vsegs">' + segs + '</div></div>';
  }

  /** Left column: the hands cached this burn, with per-hand chips x mult (never the pad total). */
  function renderHands(el, side, isPlayer) {
    const pick = !isPlayer && targeting === 'intercept';
    let rows = '';
    if (!side.pad.length) {
      rows = '<li class="empty">' + (isPlayer ? 'No hands cached yet.' : 'Nothing cached.') + '</li>';
    } else {
      rows = side.pad.map(function (h, i) {
        return '<li' + (pick ? ' class="pick" data-h="' + i + '"' : '') + '><span>' + h.label + (h.copied ? ' <span class="copied">copied</span>' : '') +
          '</span><span class="cm"><span class="c">' + h.chips + '</span>×<span class="m">' + h.mult + '</span></span></li>';
      }).join('');
    }
    el.innerHTML =
      '<div class="hhead">' + (isPlayer ? 'Hands this turn' : 'Opponent’s Hands this turn') + '</div>' +
      '<ul class="hlist">' + rows + '</ul>' +
      '<div class="hfoot">' + gaugeHtml(side, 'Potential Energy') + '</div>';
    el.querySelectorAll('li.pick').forEach(function (li) {
      li.addEventListener('click', function () { applyItem(+li.dataset.h); });
    });
  }

  function powerupsHtml() {
    const p = cfg.powerups;
    const tile = function (on, icon, text) {
      return '<span class="pu-tile' + (on ? '' : ' off') + '" title="' + text + '">' + icon + '</span>';
    };
    return '<div class="pu-row">' +
      tile(p.single.enabled, '⚡', 'Single booster: singles +' + p.single.chips + ' chips') +
      tile(p.run.enabled, '🌀', 'Run booster: small and medium straights +' + p.run.mult + ' mult') +
      tile(p.set.enabled, '💎', 'Set booster: of-a-kinds, two pair, full house, three pairs, two triplets ×' + p.set.xmult + ' mult') +
      '</div>';
  }

  /** One tile per inventory slot: owned items, then empty slots up to capacity. */
  function itemsHtml(side, isPlayer) {
    let html = '';
    OF.CONSUMABLE_DEFS.forEach(function (c) {
      for (let k = 0; k < (side.inventory[c.id] || 0); k++) {
        const tip = c.name + ': ' + c.desc;
        if (!isPlayer) {
          html += '<span class="it-tile" title="' + tip + '">' + ITEM_LABEL[c.id] + '</span>';
        } else {
          html += '<button class="it-tile' + (targeting === c.id ? ' active' : '') + '" data-id="' + c.id + '"' + (itemUsable(c.id) ? '' : ' disabled') +
            ' title="' + tip + '">' + ITEM_LABEL[c.id] + '</button>';
        }
      }
    });
    for (let k = OF.inventoryCount(side.inventory); k < cfg.consumables.capacity; k++) html += '<span class="it-tile slot" title="Empty slot"></span>';
    return '<div class="it-row">' + html + '</div>';
  }

  function toolbarHtml(side, isPlayer) {
    return '<div class="toolbar">' + powerupsHtml() + itemsHtml(side, isPlayer) + '</div>';
  }

  function dieHtml(v, cls, attrs) {
    return '<button class="die ' + cls + '" ' + attrs + '>' + v + '</button>';
  }

  function blankDice(n) {
    let s = '';
    for (let i = 0; i < 6; i++) s += '<div class="die blank' + (i < n ? '' : ' gone') + '"></div>';
    return s;
  }

  function renderOppBoard() {
    const ai = match.ai;
    const el = $('opp-board');
    const pick = targeting === 'copyDie';
    let dice = '';
    let note = '';
    if ((phase === 'select' || phase === 'farkled') && ai.rolled) {
      dice = ai.rolled.map(function (v, j) {
        return dieHtml(v, (pick ? 'clickable target' : 'static') + (rolledFresh ? ' rolling' : ''), 'data-j="' + j + '"' + (pick ? '' : ' tabindex="-1"'));
      }).join('');
      if (!OF.hasScoring(ai.rolled)) note = 'No scoring dice… unless they use an item.';
    } else {
      dice = blankDice(ai.available);
      if (phase === 'select' || phase === 'farkled') note = 'They chose to <b>launch</b> this round, so they have no roll.';
    }
    el.innerHTML =
      toolbarHtml(ai, false) +
      '<div class="dice-row">' + dice + '</div>' +
      velocityHtml(ai, 'opp') +
      '<div class="oppnote">' + (note || (ai.lastTurn ? 'Last turn: ' + describeTurn(ai.lastTurn, false) : phase === 'choose' ? 'Their dice appear when you roll.' : '')) + '</div>' +
      '<div class="board-title">Opponent Information</div>';
    if (pick) {
      el.querySelectorAll('.die[data-j]').forEach(function (b) {
        b.addEventListener('click', function () { applyItem(+b.dataset.j); });
      });
    }
  }

  function renderMyBoard() {
    const p = match.player;
    const el = $('my-board');
    const pickOwn = targeting && ITEM[targeting].target === 'ownDie';

    let actions = '';
    if (phase === 'choose' || phase === 'reveal' || phase === 'over') {
      const live = phase === 'choose';
      actions = '<button class="big-btn roll" id="a-roll"' + (live && p.available ? '' : ' disabled') + '>Roll<kbd>R</kbd></button>' +
        '<button class="big-btn launch" id="a-launch"' + (live && p.pad.length ? '' : ' disabled') + '>Launch<kbd>L</kbd></button>';
    } else if (phase === 'select') {
      actions = '<button class="big-btn roll wide" id="a-cache"' + (currentSelection() ? '' : ' disabled') + '>Cache & end turn<kbd>Enter</kbd></button>';
    } else if (phase === 'farkled') {
      actions = '<button class="big-btn launch wide" id="a-fcont">' + (hasRescue() ? 'Accept farkle (lose pad)' : 'End turn (pad destroyed)') + '<kbd>Enter</kbd></button>';
    }

    let dice = '';
    if (phase === 'select' || phase === 'farkled') {
      dice = p.dice.map(function (v, i) {
        const cls = (phase === 'select' || pickOwn ? 'clickable' : 'dead') + (selected.indexOf(i) >= 0 ? ' sel' : '') +
          (rolledFresh && !p.bonus[i] ? ' rolling' : '') + (p.bonus[i] ? ' bonus' : '') + (pickOwn ? ' target' : '') + (i === changedDie ? ' changed' : '');
        return dieHtml(v, cls, 'data-i="' + i + '" style="animation-delay:' + i * 40 + 'ms" aria-label="Die ' + (i + 1) + ': ' + v + '"');
      }).join('');
    } else {
      dice = blankDice(p.available);
    }

    el.innerHTML =
      velocityHtml(p, 'me') +
      '<div class="action-row">' + actions + '</div>' +
      '<div class="dice-row">' + dice + '</div>' +
      toolbarHtml(p, true);

    el.querySelectorAll('.die[data-i]').forEach(function (b) {
      b.addEventListener('click', function () { toggleDie(+b.dataset.i); });
    });
    el.querySelectorAll('button.it-tile').forEach(function (b) {
      b.addEventListener('click', function () { onItem(b.dataset.id); });
    });
    bind('a-roll', onRoll);
    bind('a-launch', onLaunch);
    bind('a-cache', onCache);
    bind('a-fcont', onFarkleContinue);
  }

  /** The gap between the two boards: status, the current selection, and farkle risk. */
  function renderMiddle() {
    const p = match.player;
    let status = '';
    if (targeting) {
      const t = ITEM[targeting];
      const what = t.target === 'ownDie' ? 'Click one of your dice' : t.target === 'oppDie' ? "Click one of the opponent's dice to copy" : "Click one of the opponent's hands to copy";
      status = '<b>' + t.name + ':</b> ' + what + '. <span class="lock">Esc to cancel.</span>';
    } else if (phase === 'choose' && cfg.autoRoll && onlyRollPossible()) {
      status = '<b>Rolling…</b> Your pad is empty, so rolling is your only move. <span class="lock">The opponent has locked in their move.</span>';
    } else if (phase === 'choose') {
      status = '<b>Your move.</b> Roll ' + p.available + ' dice to build thrust, or launch your pad. <span class="lock">The opponent has locked in their move.</span>';
    } else if (phase === 'select') {
      status = '<b>Select one or more scoring hands</b> to cache, then confirm. Items can change your dice first.';
    } else if (phase === 'farkled') {
      status = hasRescue()
        ? '<b class="bad">You farkled</b>, but you can try an item to make a scoring hand. Or accept the farkle.'
        : '<b class="bad">Farkle!</b> No scoring hand. Your pad is destroyed.';
    } else if (phase === 'reveal') {
      status = 'Revealing round…';
    } else if (phase === 'over') {
      status = '<b>Level over.</b> <button class="link" id="a-again">' + (match.winner === 'player' ? 'Next level' : 'New run') + '</button>';
    }

    let sel = '';
    if (phase === 'select') {
      if (!selected.length) {
        sel = '<span class="hint">Click dice (or press 1–' + p.dice.length + ') to select a hand.' + (p.bonus.some(Boolean) ? ' Copied dice (blue) are free: they don’t use up your live dice.' : '') + '</span>';
      } else {
        const hands = currentSelection();
        if (!hands) {
          sel = '<span class="bad">Not a valid hand: every selected die must be part of a scoring hand.</span>';
        } else {
          const left = p.available - match.liveCount(p, selected);
          sel = hands.map(function (h) { return '<span class="hand">' + h.label + ' · ' + cmHtml(h.chips, h.mult) + '</span>'; }).join('') +
            '<div class="hint">' + (left === 0 && cfg.hotDice ? '<b class="accent">Hot dice!</b> All six dice come back.' : left + ' dice left for the next roll') + '</div>';
        }
      }
    } else if (phase === 'farkled') {
      sel = '<span class="bad">Accepting the farkle destroys your pad of ' + p.pad.length + ' hand' + (p.pad.length === 1 ? '' : 's') + '.</span>';
    }

    let risk = '';
    if (cfg.showFarkleRisk && phase === 'choose' && p.available) {
      risk = 'Farkle chance on a ' + p.available + '-die roll: <b>' + pctText(OF.farkleChance(p.available)) + '</b>';
    } else if (cfg.showFarkleRisk && phase === 'select' && selected.length && currentSelection()) {
      let left = p.available - match.liveCount(p, selected);
      if (left === 0 && cfg.hotDice) left = 6;
      risk = left ? 'Next roll would be ' + left + ' dice: <b>' + pctText(OF.farkleChance(left)) + '</b> farkle chance' : 'No dice left after this: you will have to launch.';
    }

    $('middle').innerHTML = '<div class="status">' + status + '</div><div class="selinfo">' + sel + '</div><div class="risk">' + risk + '</div>' +
      (phase === 'farkled' ? '<div class="farkle-banner">FARKLE</div>' : '');
    bind('a-again', continueRun);
  }

  /** Right column: a vertical race track from 0 to the target with both rockets on it. */
  function niceStep(target) {
    const raw = target / 3;
    const mag = Math.pow(10, Math.floor(Math.log10(raw)));
    const steps = [1, 2, 2.5, 5, 10].map(function (m) { return m * mag; });
    return steps.reduce(function (b, s) { return Math.abs(s - raw) < Math.abs(b - raw) ? s : b; });
  }

  function renderTrack() {
    const t = cfg.targetScore;
    const step = niceStep(t);
    let ticks = '';
    for (let v = step; v < t - step * 0.25; v += step) {
      ticks += '<div class="tick" style="bottom:' + (v / t) * 100 + '%"><span>' + fmt(v) + '</span></div>';
    }
    const pos = function (side) { return Math.min(1, side.banked / t) * 100; };
    $('track').innerHTML =
      '<div class="tlabel">Target Velocity</div><div class="ttarget">' + fmt(t) + '</div>' +
      '<div class="tline-wrap"><div class="tline">' + ticks +
      '<div class="trocket me" style="bottom:' + pos(match.player) + '%" title="You: ' + fmt(match.player.banked) + '"></div>' +
      '<div class="trocket opp" style="bottom:' + pos(match.ai) + '%" title="Opponent: ' + fmt(match.ai.banked) + '"></div>' +
      '</div></div><div class="tzero">0</div>';
  }

  function itemsText(items) {
    if (!items || !items.length) return '';
    return items.map(function (i) { return i.name + ' (' + i.text + ')'; }).join(', ');
  }

  function describeTurn(t, short) {
    if (!t) return '<span class="muted">No turns yet.</span>';
    let s = '';
    if (t.type === 'cache') {
      s = '<span class="t-cache">Rolled ' + t.roll.join(' ') + ', cached</span> ' + t.hands.map(function (h) { return h.label; }).join(' + ');
      if (t.hot) s += ' · <b>Hot dice!</b>';
    } else if (t.type === 'farkle') {
      s = '<span class="t-farkle">Farkle!</span> Rolled ' + t.roll.join(' ') + (t.handsLost.length ? ' and lost a pad of ' + t.handsLost.length + ' hand' + (t.handsLost.length === 1 ? '' : 's') : '');
    } else if (t.type === 'launch') {
      s = '<span class="t-launch">Launched</span> for ' + fmt(t.resolution.total);
    }
    if (t.items && t.items.length) s += ' · <span class="t-item">used ' + itemsText(t.items) + '</span>';
    if (!short && t.reason) s += ' <span class="why">“' + t.reason + '”</span>';
    return s;
  }

  function cmHtml(chips, mult) {
    return '<span class="cm"><span class="c">' + fmt(chips) + '</span> × <span class="m">' + mult + '</span></span>';
  }

  function pctText(ch) {
    return (ch * 100).toFixed(ch < 0.1 && ch > 0 ? 1 : 0) + '%';
  }

  function bind(id, fn) {
    const el = $(id);
    if (el) el.addEventListener('click', fn);
  }

  /** Hand values, power-ups and gauge tiers, in a dialog. */
  function showHandValues() {
    let rows = '<tr><th>Hand</th><th>Dice</th><th class="num">Base</th><th class="num">With power-ups</th></tr>';
    OF.HAND_DEFS.forEach(function (h) {
      const base = cfg.hands[h.id];
      const v = OF.handValue(h.id, cfg);
      rows += '<tr><td>' + h.name + '</td><td class="muted">' + OF.HAND_DICE_TEXT[h.id] + '</td>' +
        '<td class="num">' + cmHtml(base.chips, base.mult) + '</td>' +
        '<td class="num">' + cmHtml(v.chips, v.mult) + (v.boosts.length ? '<br><span class="boost">' + v.boosts.join(', ') + '</span>' : '') + '</td></tr>';
    });
    const p = cfg.powerups;
    const th = OF.gaugeThresholds(cfg);
    const tiers = [];
    for (let t = 1; t <= cfg.gaugeTiers; t++) {
      const lo = t === 1 ? 0 : th[t - 2];
      const hi = t - 1 < th.length ? th[t - 1] : null;
      tiers.push('<b>' + OF.gaugeTier(t === 1 ? 0 : lo, 1, cfg).name + '</b> ' + (hi === null ? fmt(lo) + '+' : fmt(lo) + '–' + fmt(hi)));
    }
    openModal(
      '<h3>Hand values <span class="muted" style="font-size:13px;font-weight:400">' + (cfg.scoringMode === 'pooled' ? 'pooled scoring' : 'per-hand scoring') + '</span></h3>' +
      '<table class="values">' + rows + '</table>' +
      '<p class="formula">' + (cfg.scoringMode === 'pooled'
        ? 'At launch the pad resolves as <b>(total chips) × (total mult)</b> across every cached hand. Longer burns grow faster than linearly.'
        : 'At launch each cached hand resolves as its own <b>chips × mult</b>, and the results are added.') + '</p>' +
      '<h4>Power-ups <span class="muted" style="font-weight:400">same on both ships</span></h4><div class="powerups">' +
      '<div class="pu' + (p.single.enabled ? '' : ' off') + '"><span>⚡ Single booster</span><span>Singles: +' + p.single.chips + ' chips</span></div>' +
      '<div class="pu' + (p.run.enabled ? '' : ' off') + '"><span>🌀 Run booster</span><span>Small/medium straights: +' + p.run.mult + ' mult</span></div>' +
      '<div class="pu' + (p.set.enabled ? '' : ' off') + '"><span>💎 Set booster</span><span>Of-a-kinds, two pair, full house, three pairs, two triplets: ×' + p.set.xmult + ' mult</span></div></div>' +
      '<h4>Potential Energy tiers (level ' + level + ')</h4><p class="formula">' + tiers.join(' · ') + '<br>The gauge shows a tier, never the exact launch total.</p>' +
      '<div class="foot"><button class="primary" id="hv-close">Close<kbd>Esc</kbd></button></div>',
      closeModal
    );
    bind('hv-close', closeModal);
  }

  function roundLogHtml() {
    return roundLog.map(function (r) {
      return '<div><span class="r">R' + r.round + '</span> You: ' + describeTurn(r.player, true) + ' &nbsp;|&nbsp; AI: ' + describeTurn(r.ai, true) + '</div>';
    }).reverse().join('') || '<div class="muted">Nothing yet.</div>';
  }

  // ---------------------------------------------------------------------------
  // Modals
  // ---------------------------------------------------------------------------

  let modalOnEnter = null;
  let revealTimers = [];

  function openModal(html, onEnter) {
    $('modal').innerHTML = html;
    $('overlay').hidden = false;
    modalOnEnter = onEnter || null;
  }
  function closeModal() {
    revealTimers.forEach(clearTimeout);
    revealTimers = [];
    $('overlay').hidden = true;
    $('modal').innerHTML = '';
    modalOnEnter = null;
    if (match) maybeAutoRoll();
  }

  function turnCard(who, t, idPrefix) {
    let cls = 'card';
    let body = '';
    if (t.type === 'cache') {
      body = '<div class="big" style="color:var(--accent)">Cached</div>' +
        '<div>' + t.hands.map(function (h) { return h.label + ' ' + cmHtml(h.chips, h.mult); }).join('<br>') + '</div>' +
        '<div class="muted">Rolled ' + t.roll.join(' ') + afterItems(t) + (t.hot ? ' · <b style="color:var(--accent)">Hot dice! Six dice return.</b>' : ' · ' + t.diceLeft + ' dice left') + '</div>' +
        (t.earned ? '<div class="muted">Earned an item: <b style="color:var(--text)">' + ITEM[t.earned].icon + ' ' + ITEM[t.earned].name + '</b></div>' : '');
    } else if (t.type === 'farkle') {
      cls += ' farkle';
